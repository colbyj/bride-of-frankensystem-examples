# Database
SQLALCHEMY_DATABASE_URI = 'sqlite:///unity_example.db'

# The secret key MUST be changed to something unique before running a real study.
SECRET_KEY = 'Example key for the Unity 2021.1 example. Please change me.'

# Application
TITLE = 'Unity Example Project (Unity 2021.1)'
ADMIN_PASSWORD = 'example'      # Used to log in to /admin
PORT = 5006
APPLICATION_ROOT = ''            # Optional URL prefix; rarely changed
USE_BREADCRUMBS = false          # Show a breadcrumb-style progress bar
RETRIEVE_SESSIONS = true         # Resume a participant's progress if their ID was already used
ALLOW_RETAKES = true             # If false (and external_id is in use), the same ID cannot be entered twice
LOG_QUESTIONNAIRE_INTERACTIONS = false  # Log focus/blur/change/paste events on questionnaire inputs

# Two conditions; the Unity build calls /fetch_condition to discover which one it is in.
CONDITIONS = [{label='condition 1', enabled=true}, {label='condition 2', enabled=true}]

# External ID prompt shown on /external_id (used for Prolific, MTurk, lab-issued IDs, etc.)
EXTERNAL_ID_LABEL = "Participant ID"
EXTERNAL_ID_PROMPT = "Please enter a participant ID for testing"

# Completion: every participant sees the same static code. Set GENERATE_COMPLETION_CODE = true
# (or OUTGOING_URL) instead to randomise the code or redirect to an external page.
STATIC_COMPLETION_CODE = 'example'
COMPLETION_CODE_MESSAGE = 'Thanks for trying the example. The admin panel password is:'
# OUTGOING_URL = ''

# Pages shown to the participant, in order.
# Each Unity build is shown three times to demonstrate the three embedding patterns:
#   - game_embed:      Unity inside BOFS's standard page chrome (extends unity_webgl.html)
#   - game_fullscreen: Unity filling the viewport (extends unity_webgl_fullscreen.html)
#   - game_custom:     Unity in a fully custom HTML page (no BOFS chrome)
PAGE_LIST = [
    {name='Consent', path='consent'},
    {name='External ID', path='external_id'},
    {name='Instructions', path='instructions/game_embed'},
    {name='Game (Embedded)', path='game_embed'},
    {name='Instructions', path='instructions/game_fullscreen'},
    {name='Game (Fullscreen)', path='game_fullscreen'},
    {name='Instructions', path='instructions/game_custom'},
    {name='Game (Custom Page)', path='game_custom'},
    {name='End', path='end'}
]
