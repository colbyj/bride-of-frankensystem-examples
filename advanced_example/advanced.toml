# Database
SQLALCHEMY_DATABASE_URI = 'sqlite:///advanced.db'

# Application
TITLE = 'Advanced Example Project'
ADMIN_PASSWORD = 'example'      # Used to log in to /admin
PORT = 5004
APPLICATION_ROOT = ''            # Optional URL prefix; rarely changed
USE_BREADCRUMBS = false          # Show a breadcrumb-style progress bar
RETRIEVE_SESSIONS = true         # Resume a participant's progress if their ID was already used
ALLOW_RETAKES = true             # If false, the same external ID cannot be entered twice
LOG_GRID_CLICKS = false          # Log every radiogrid click (useful for fine-grained timing)

# Two conditions; the page list below shows different questionnaires depending on which
# condition the participant is assigned to.
CONDITIONS = [{label='condition 1', enabled=true}, {label='condition 2', enabled=true}]

# External ID prompt shown on /external_id (used for Prolific, MTurk, lab-issued IDs, etc.)
EXTERNAL_ID_LABEL = "Participant ID"
EXTERNAL_ID_PROMPT = "Please enter the ID provided to you."

# Completion: every participant sees the same static code. Set GENERATE_COMPLETION_CODE = true
# (or OUTGOING_URL) instead to randomise the code or redirect to an external page.
STATIC_COMPLETION_CODE = 'example'
COMPLETION_CODE_MESSAGE = 'Thanks for participating. Your completion code is:'
# OUTGOING_URL = ''

# Pages shown to the participant, in order.
# Append /<tag> to a questionnaire path to include the same questionnaire more than once.
PAGE_LIST = [
    {name='Consent', path='consent'},
    {name='External ID', path='external_id'},
    {name='Instructions', path='instructions/example_instructions'},
    {name='Task', path='task'},
    {name='Questionnaire', path='questionnaire/example'},
    {conditional_routing=[
        {condition=1, page_list=[
            {name='Questionnaire', path='questionnaire/grid'},
            {name='Questionnaire', path='questionnaire/variables'}
        ]},
        {condition=2, page_list=[
            {name='Questionnaire', path='questionnaire/variables'},
            {name='Questionnaire', path='questionnaire/grid'}
        ]}
    ]},
    {name='End', path='end'}
]
