{% extends "template.html" %}
{% block head %}
{% endblock %}

{% block content %}
    {% if incorrect %}
        <p><b>That's not the answer we were looking for. Please try again.</b></p>
    {% else %}
        <p>Look at the image below and type your answer in the box.</p>
    {% endif %}

    <hr>

    <form id="form" action="#" method="post">
        <p><img src="{{ url_for('my_blueprint.static', filename='tux.png') }}"></p>

        <p>
            <label for="answer">This is the mascot for which operating system? (hint: it's Linux)</label>
            <input type="text" id="answer" name="answer" required>
        </p>

        <input type="submit" name="submit" value="Submit Answer">
    </form>
{% endblock %}
