# Database
SQLALCHEMY_DATABASE_URI = 'sqlite:///psychojs_example.db'
SECRET_KEY = 'You Must Change This to Something Unique'

# Application
TITLE = 'PsychoJS Example - Stroop Task with BOFS Backend'
ADMIN_PASSWORD = 'example'
PORT = 5011
APPLICATION_ROOT = ''
USE_BREADCRUMBS = true
RETRIEVE_SESSIONS = true
ALLOW_RETAKES = true
LOG_QUESTIONNAIRE_INTERACTIONS = false

# Single condition. Replace with a list of {label, enabled} entries to randomize.
CONDITIONS = []

# Completion: every participant sees the same static code. Set GENERATE_COMPLETION_CODE = true
# (or OUTGOING_URL) instead to randomise the code or redirect to an external page.
STATIC_COMPLETION_CODE = 'example'
COMPLETION_CODE_MESSAGE = 'Thanks for trying the example. The admin panel password is:'
# OUTGOING_URL = ''

# Pages shown to the participant, in order.
# Demonstrates the complementary split: BOFS handles consent / questionnaires /
# page flow; PsychoJS runs the Stroop task in the browser and POSTs trial rows
# back to the BOFS-managed `psychojs_trials` table. The Stroop page is a
# `custom/` page so PsychoJS takes over the full viewport with no BOFS chrome.
PAGE_LIST = [
    {name='Consent', path='consent'},
    {name='Demographics', path='questionnaire/demographics'},
    {name='Instructions', path='instructions/task_instructions'},
    {name='Stroop Task', path='custom/psychojs_stroop'},
    {name='Post-task', path='questionnaire/post_task'},
    {name='End', path='end'}
]
