{# Fully custom Unity WebGL host page. Unlike game_embed.html and
   game_fullscreen.html, this template does NOT extend a BOFS base
   template, so none of the standard BOFS chrome appears. Use this when
   you need full control over the surrounding HTML. #}
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | unity_project</title>
</head>
<body style="text-align: center">
<canvas id="unity-canvas" width=960 height=600 style="width: 960px; height: 600px; background: #231F20"></canvas>
<script src="unity_example/unity_example.loader.js"></script>
<script>
    // Mobile viewport tweak: fill the browser client area with the canvas.
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
    }

    var gameInstance = null;
    createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "unity_example/unity_example.data.gz",
        frameworkUrl: "unity_example/unity_example.framework.js.gz",
        codeUrl: "unity_example/unity_example.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "unity_project",
        productVersion: "0.1",
        // matchWebGLToCanvasSize: false, // Uncomment to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1,           // Uncomment to override low DPI rendering on high DPI displays.
    }).then((instance) => { gameInstance = instance });
    // Builds compressed with Brotli require HTTPS; this example uses gzip.
</script>

<script type="text/javascript">
    // Push the participant ID into the running build once the canvas has
    // loaded. SendMessage requires gameInstance to be non-null, so the
    // call is delayed by 5 seconds.
    setTimeout(function() {
        if (gameInstance == null)
            return;
        gameInstance.SendMessage('Canvas', 'SetParticipantID', {{ session['participantID'] }})
    }, 5000);
</script>
</body>
</html>
